<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gangster Bank Map</title>

  <!-- 카카오맵 SDK -->
  <script
    type="text/javascript"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d5dd97a46923dda3a649e5e521134f5f&libraries=services&autoload=false">
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Arial", sans-serif;
    }

    body {
      background: #111;
      color: white;
      overflow: hidden;
    }

    /* 전체 화면 2분할 */
    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* 왼쪽 패널 */
    .sidebar {
      width: 35%;
      background: #181818;
      border-right: 3px solid #ff0000;
      padding: 20px;
      overflow-y: auto;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: #ff0000;
      margin-bottom: 20px;
      text-shadow: 0 0 10px red;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ff0000;
      background: #222;
      color: white;
      border-radius: 8px;
      outline: none;
    }

    .search-box button {
      padding: 12px 18px;
      background: #ff0000;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .search-box button:hover {
      background: #cc0000;
    }

    /* 검색 결과 */
    .result-item {
      background: #222;
      border-left: 5px solid red;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .result-item:hover {
      background: #2d2d2d;
      transform: translateX(5px);
    }

    .place-name {
      font-size: 18px;
      font-weight: bold;
      color: #ff4d4d;
      margin-bottom: 6px;
    }

    .place-address {
      font-size: 14px;
      color: #ccc;
    }

    /* 오른쪽 지도 */
    #map {
      width: 65%;
      height: 100vh;
    }

    /* 커스텀 X 마커 */
    .custom-marker {
      width: 40px;
      height: 40px;
      background: rgba(255,0,0,0.9);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 15px red;
    }

    .custom-marker::before,
    .custom-marker::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 5px;
      background: white;
      top: 17px;
      left: 6px;
      border-radius: 5px;
    }

    .custom-marker::before {
      transform: rotate(45deg);
    }

    .custom-marker::after {
      transform: rotate(-45deg);
    }

    /* 모바일 대응 */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 45%;
      }

      #map {
        width: 100%;
        height: 55%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 왼쪽 검색 영역 -->
    <div class="sidebar">

      <div class="title">
        GANGSTER BANK RAID MAP
      </div>

      <div class="search-box">
        <input type="text" id="keyword" placeholder="은행 검색..." />
        <button onclick="searchPlace()">SEARCH</button>
      </div>

      <div id="result-list"></div>

    </div>

    <!-- 오른쪽 지도 -->
    <div id="map"></div>

  </div>

  <script>
    let map;
    let currentPosition;
    let markers = [];
    let placesService;

    // 카카오맵 로드 완료 후 실행
    kakao.maps.load(function () {

      // 현재 위치 가져오기
      navigator.geolocation.getCurrentPosition(
        function (position) {

          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          currentPosition = new kakao.maps.LatLng(lat, lng);

          // 지도 생성
          map = new kakao.maps.Map(document.getElementById("map"), {
            center: currentPosition,
            level: 5
          });

          // 장소 검색 서비스 생성
          placesService = new kakao.maps.services.Places();

          // 현재 위치 마커 표시
          const currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition
          });

          // 현재 위치 인포윈도우
          const infoWindow = new kakao.maps.InfoWindow({
            content: `
              <div style="
                padding:8px;
                font-size:13px;
                color:black;
              ">
                현재 위치
              </div>
            `
          });

          infoWindow.open(map, currentMarker);

          // 기본 검색 실행
          document.getElementById("keyword").value = "은행";
          searchPlace();
        },

        // 위치 권한 거부 시
        function () {
          alert("위치 권한이 필요합니다.");
        }
      );
    });

    // 장소 검색 함수
    function searchPlace() {

      const keyword = document.getElementById("keyword").value.trim();

      if (!keyword) {
        alert("검색어를 입력하세요.");
        return;
      }

      // 현재 지도 기준으로 검색
      placesService.keywordSearch(
        keyword,
        function (data, status) {

          if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
          } else {
            alert("검색 결과가 없습니다.");
          }
        },
        {
          location: currentPosition
        }
      );
    }

    // 검색 결과 출력
    function displayPlaces(places) {

      const resultList = document.getElementById("result-list");

      resultList.innerHTML = "";

      // 기존 마커 제거
      removeMarkers();

      places.forEach(function (place) {

        const position = new kakao.maps.LatLng(place.y, place.x);

        // 커스텀 빨간 X 마커 생성
        const markerContent = `
          <div class="custom-marker"></div>
        `;

        const customOverlay = new kakao.maps.CustomOverlay({
          position: position,
          content: markerContent,
          yAnchor: 1
        });

        customOverlay.setMap(map);

        markers.push(customOverlay);

        // 결과 리스트 아이템 생성
        const item = document.createElement("div");
        item.className = "result-item";

        item.innerHTML = `
          <div class="place-name">${place.place_name}</div>
          <div class="place-address">${place.address_name}</div>
        `;

        // 클릭 시 해당 위치로 이동
        item.addEventListener("click", function () {

          map.setCenter(position);

          const infoWindow = new kakao.maps.InfoWindow({
            content: `
              <div style="
                padding:10px;
                color:black;
                font-size:13px;
              ">
                <strong>${place.place_name}</strong><br/>
                ${place.address_name}
              </div>
            `
          });

          infoWindow.open(map);
          infoWindow.setPosition(position);
        });

        resultList.appendChild(item);
      });

      // 검색 결과 범위로 지도 이동
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place) {
        bounds.extend(new kakao.maps.LatLng(place.y, place.x));
      });

      map.setBounds(bounds);
    }

    // 기존 마커 제거 함수
    function removeMarkers() {

      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];
    }
  </script>

</body>
</html>
